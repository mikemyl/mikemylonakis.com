---
layout: default
---

<div id="main" role="main">
  <section class="page__content" id="typed">
    <span class="intro-text">{{ content }}</span>
    <div id="typed_avatar">
      <img class="typed-img" src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}" itemprop="image">
    </div>
    {% if page.tagline %}<p class="typed-tagline">{{ page.tagline }}</p>{% endif %}
    <p><a href="{{ '/about/' | relative_url }}" class="btn btn--primary">About me</a></p>
  </section>
</div>

{% if site.dynamic-typing == true %}
<script>
  // typed.min.js is a jQuery plugin and jQuery loads at the end of <body>,
  // so load the plugin only after the DOM (and jQuery) is ready.
  document.addEventListener("DOMContentLoaded", function () {
    var lines = [{% for line in site.typed_lines %}{{ line.text | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}];
    {% if site.shuffle %}
    for (var i = lines.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = lines[i]; lines[i] = lines[j]; lines[j] = tmp;
    }
    {% endif %}
    var script = document.createElement("script");
    script.src = "{{ '/assets/js/typed/typed.min.js' | relative_url }}";
    script.onload = function () {
      $(".intro-text").typed({
        strings: lines,
        typeSpeed: {{ site.type-speed }},
        backDelay: {{ site.delete-delay }},
        startDelay: {{ site.start-delay }},
        loop: {{ site.loop }},
        loopCount: {{ site.loop-count }},
        cursorChar: "|"
      });
    };
    document.body.appendChild(script);
  });
</script>
{% endif %}
